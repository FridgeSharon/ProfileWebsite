services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_ORIGIN=*
      - DB_PATH=/app/backend/data/app.sqlite
    volumes:
      - sqlite_data:/app/backend/data
    ports:
      - "3000:3000"

  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
